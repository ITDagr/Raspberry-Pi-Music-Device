# Builds the browser demo of the music software (software/web) with pygbag
# and publishes it on GitHub Pages. Pull requests only build it, as a check.
name: Browser demo

on:
  push:
    branches: [main]
    paths: ["software/**", ".github/workflows/browser-demo.yml"]
  pull_request:
    paths: ["software/**", ".github/workflows/browser-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      - run: python software/web/build.py
      - run: test -f software/web/build/device/build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: software/web/build/device/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
